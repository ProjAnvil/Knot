name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Release Binaries
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install

      - name: Build backend binaries
        working-directory: backend
        run: make package-all

      - name: Build MCP server binaries
        working-directory: mcp-server
        run: make build-all

      - name: Prepare release artifacts
        run: |
          mkdir -p release

          # CLI binaries with embedded frontend
          cp backend/bin/knot-linux release/knot-linux
          cp backend/bin/knot-macos-amd64 release/knot-macos-amd64
          cp backend/bin/knot-macos-arm64 release/knot-macos-arm64
          cp backend/bin/knot-windows.exe release/knot-windows.exe

          # Server binaries (API only)
          cp backend/bin/knot-server-linux release/knot-server-linux
          cp backend/bin/knot-server-macos-amd64 release/knot-server-macos-amd64
          cp backend/bin/knot-server-macos-arm64 release/knot-server-macos-arm64
          cp backend/bin/knot-server-windows.exe release/knot-server-windows.exe

          # MCP server binaries
          cp mcp-server/bin/knot-mcp-linux release/knot-mcp-linux
          cp mcp-server/bin/knot-mcp-macos release/knot-mcp-macos-amd64
          cp mcp-server/bin/knot-mcp-macos-arm64 release/knot-mcp-macos-arm64
          cp mcp-server/bin/knot-mcp-windows.exe release/knot-mcp-windows.exe

          # Create checksums
          cd release
          sha256sum * > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/knot-linux
            release/knot-macos-amd64
            release/knot-macos-arm64
            release/knot-windows.exe
            release/knot-server-linux
            release/knot-server-macos-amd64
            release/knot-server-macos-arm64
            release/knot-server-windows.exe
            release/knot-mcp-linux
            release/knot-mcp-macos-amd64
            release/knot-mcp-macos-arm64
            release/knot-mcp-windows.exe
            release/checksums.txt
          body: |
            ## Knot ${{ github.ref_name }}

            ## 🚀 Highlights

            - **Multi-format export** — export APIs as Knot JSON, OpenAPI 3.1, and Postman Collection v2.1 alongside the existing HTML documentation
            - **Import with auto-detection** — import Knot JSON, OpenAPI 3.1, and Postman v2.1 files with automatic format detection and a preview-before-confirm step
            - **Full E2E coverage** — export and import flows are now covered end-to-end by an automated Playwright suite

            ## What's Changed

            ### Features
            * Export builders for Knot JSON v1, OpenAPI 3.1, and Postman Collection v2.1, wired into the export endpoint alongside HTML
            * Import pipeline with automatic format detection (Knot JSON / OpenAPI 3.x / Postman v2.1), dry-run preview via `POST /api/import`, and transactional apply with merge semantics
            * Export dialog format picker and import dialog with preview-before-confirm in the frontend
            * `KNOT_PORT` environment variable override for the server port

            ### Tests
            * Playwright E2E harness plus export/import round-trip, multi-format export, and Postman/OpenAPI import specs
            * Coverage gates for handler import/export coverage and expanded ImportDocument tests

            ### CI & Release
            * New test and E2E workflow with coverage reporting
            * Release notes switched to an English template (highlights, grouped changelog, downloads table)

            ## New Contributors

            * Welcome to new contributors (if any)!

            ## Full Changelog

            https://github.com/ProjAnvil/knot/compare/v0.5.0...${{ github.ref_name }}

            ## 📦 Downloads

            | Component | Platform | Asset |
            | --- | --- | --- |
            | CLI (with embedded frontend) | macOS (Apple Silicon) | `knot-macos-arm64` |
            | CLI (with embedded frontend) | macOS (Intel) | `knot-macos-amd64` |
            | CLI (with embedded frontend) | Linux (AMD64) | `knot-linux` |
            | CLI (with embedded frontend) | Windows (AMD64) | `knot-windows.exe` |
            | Server (API only) | macOS (Apple Silicon) | `knot-server-macos-arm64` |
            | Server (API only) | macOS (Intel) | `knot-server-macos-amd64` |
            | Server (API only) | Linux (AMD64) | `knot-server-linux` |
            | Server (API only) | Windows (AMD64) | `knot-server-windows.exe` |
            | MCP Server (AI integration) | macOS (Apple Silicon) | `knot-mcp-macos-arm64` |
            | MCP Server (AI integration) | macOS (Intel) | `knot-mcp-macos-amd64` |
            | MCP Server (AI integration) | Linux (AMD64) | `knot-mcp-linux` |
            | MCP Server (AI integration) | Windows (AMD64) | `knot-mcp-windows.exe` |
            | All | Checksums | `checksums.txt` |

            Verify downloads with `checksums.txt` (sha256):

            ```bash
            sha256sum -c checksums.txt      # Linux
            shasum -a 256 -c checksums.txt  # macOS
            ```

            ### Installation

            ```bash
            # macOS/Linux - make the downloaded binary executable
            chmod +x knot-*

            # Move it into your PATH (optional)
            sudo mv knot-macos-arm64 /usr/local/bin/knot

            # MCP Server - configure Claude Desktop
            # 1. Download the knot-mcp binary for your platform
            # 2. Make it executable: chmod +x knot-mcp-*
            # 3. Add it to your Claude Desktop config (see mcp-server/README.md)
            ```
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
