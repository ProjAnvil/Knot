name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref so pushes during a PR don't queue up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Note: backend/go.mod's committed `replace github.com/ProjAnvil/knot/models => ../models` is a permanent in-repo redirect to the sibling module (external consumers resolve the published models/vX.Y.Z tag instead); it is what makes module-mode (GOWORK=off) resolution work, and directory replaces need no go.sum entries.
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Run tests with coverage
        working-directory: backend
        run: make test-coverage

      # Upload even when the coverage gate fails so the profile is
      # available for debugging the failure.
      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.out

  models:
    name: Models module
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # GOTOOLCHAIN may auto-download the go.work toolchain version
          # (newer than models/go.mod's); that is acceptable.
          go-version-file: models/go.mod

      - name: Build and test
        working-directory: models
        run: go build ./... && go test ./... -race

      - name: Coverage gate
        working-directory: models
        run: make test-coverage

      # Drift lock: regenerate the goldens from the repo root (the ./tools
      # pattern only resolves there) and fail if committed files change.
      - name: Check generated goldens for drift
        working-directory: .
        run: go run ./tools/cmd/gen-schema && go run ./tools/cmd/gen-ts && git diff --exit-code -- models/schema models/ts

      # Consumption smoke: build a throwaway module outside the workspace and
      # consume models via a filesystem replace, proving the module graph is
      # usable with GOWORK=off (i.e. without the go.work workspace).
      - name: Consumption smoke test
        run: |
          SMOKE=$(mktemp -d)
          cd "$SMOKE"
          go mod init smoke
          go mod edit -replace github.com/ProjAnvil/knot/models=${{ github.workspace }}/models
          cat > main.go <<'EOF'
          package main

          import (
            "fmt"
            "os"

            "github.com/ProjAnvil/knot/models"
            "github.com/ProjAnvil/knot/models/gormbind"
          )

          func main() {
            g := models.Group{Name: "smoke"}
            n := len(gormbind.MigrateModels())
            fmt.Printf("group=%q valid=%v format=%q migrations=%d\n",
              g.Name, models.IsValidMethod("GET"), models.WireFormat, n)
            if n != 3 {
              fmt.Printf("unexpected migration count: %d\n", n)
              os.Exit(1)
            }
          }
          EOF
          # tidy is REQUIRED: a replace without a require cannot build.
          GOWORK=off go mod tidy
          GOWORK=off go build ./... && GOWORK=off ./smoke

      # Upload even when the coverage gate fails so the profile is
      # available for debugging the failure.
      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: models-coverage
          path: models/coverage.out

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: frontend
        run: bun install

      - name: Type check
        working-directory: frontend
        run: bun run check

      - name: Unit tests
        working-directory: frontend
        run: bunx vitest run

      - name: Unit tests with coverage
        working-directory: frontend
        run: bunx vitest run --coverage

      - name: Build
        working-directory: frontend
        run: bun run build

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install

      - name: Install Playwright browsers
        working-directory: frontend
        run: bunx playwright install --with-deps chromium

      # run-env.sh builds the frontend, embeds it into the Go CLI binary and
      # serves it on port 3999 for the Playwright webServer.
      - name: Run E2E tests
        working-directory: frontend
        env:
          CI: true
        run: bun run test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
